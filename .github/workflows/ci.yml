name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck → tests (incl. axe) → build (ui + agent docs + site) → size budgets
      - run: npm run ci
