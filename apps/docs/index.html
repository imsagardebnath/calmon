<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pikore UI: React and Tailwind components built on clinical-safety principles. Calm interfaces for systems that cannot fail." />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230F766E'/%3E%3Cpath d='M7.6 19V5' fill='none' stroke='%23FFFFFF' stroke-width='2.8' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='9.6' r='5' fill='%23FFFFFF'/%3E%3Cpath d='M9.9 9.6h1.5l1-2.4 1.5 4.8 1-2.4h.7' fill='none' stroke='%230F766E' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="alternate" type="text/plain" href="llms.txt" title="Docs for AI agents" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pikore UI</title>
    <script>
      // Set theme and density before first paint so there is no flash. Dark is the default.
      // Keys match PikoreProvider ("pikore-theme") and the density switcher ("pikore-density").
      try {
        var t = localStorage.getItem('pikore-theme')
        var dark = t === 'light' ? false : t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true
        if (dark) document.documentElement.classList.add('dark')
        var d = localStorage.getItem('pikore-density')
        if (d === 'compact' || d === 'station' || d === 'comfortable') document.documentElement.dataset.density = d
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
